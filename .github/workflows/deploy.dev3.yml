name: Deploy to dev3 (Enonic XP Cloud)
on:
  workflow_dispatch:
    inputs:
      DEPLOY_PREVIOUS:
        description: 'Deploy previous version to internal'
        required: false
        type: boolean
        default: true
      SKIP_TESTS:
        description: 'Skip Playwright tests'
        required: false
        type: boolean
        default: true

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      team: navno
      image-suffix: dev3
      cdn-source: ./packages/server/public
      cdn-destination: /nav-dekoratoren
      prune-remove: ''
      playwright: ${{ !inputs.SKIP_TESTS && 'pnpm run test:e2e' || '' }}
    secrets: inherit

  network-policy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: dev-gcp
      resource: .nais/network-policy-navno.yml

  deploy:
    needs: [build, network-policy]
    uses: ./.github/workflows/deploy-instance-navno.yml
    permissions: { contents: read, id-token: write }
    with:
      instance: dev3
      cluster: dev-gcp
      image: ${{ needs.build.outputs.image }}
      deploy-previous: ${{ inputs.DEPLOY_PREVIOUS }}
    secrets: inherit
