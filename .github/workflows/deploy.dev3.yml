name: Deploy to dev3 (Enonic XP Cloud)
on:
  workflow_dispatch:
    inputs:
      SKIP_TESTS:
        description: 'Skip Playwright tests'
        required: false
        type: boolean
        default: true

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      team: navno
      image-suffix: dev3
      cdn-source: ./packages/server/public
      cdn-destination: /nav-dekoratoren
      prune-remove: ''
      playwright: ${{ !inputs.SKIP_TESTS && 'pnpm run test:e2e' || '' }}
    secrets: inherit

  network-policy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: dev-gcp
      resource: .nais/network-policy-navno.yml

  # Standalone deploy: dev3 does not use the version proxy architecture
  # (no previous version, recorded vars or version-authority configmap).
  deploy:
    needs: [build, network-policy]
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: dev-gcp
      resource: .nais/config-navno.yml
      vars: .nais/vars/dev3-navno.yml
      var: image=${{ needs.build.outputs.image }},versionId=${{ github.sha }},deployInstance=dev3
      environment: dev3
