apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nav-dekoratoren-alerts
  namespace: personbruker
  labels:
    team: personbruker
spec:
  groups:
    - name: nav-dekoratoren-alerts
      rules:
        # not_found is left out on purpose: it mostly means callers are pinned to versions older
        # than the internal app TTL, which is expected and not fixable by us. Use a dashboard for that.
        # unreachable/error_response mean an internal version app exists but is failing.
        - alert: nav-dekoratoren version proxy failing
          expr: sum by (result) (rate(version_proxy_requests_total{namespace="personbruker", app="nav-dekoratoren", result=~"unreachable|error_response"}[5m])) > 0.1
          for: 15m
          annotations:
            summary: '[nav-dekoratoren] Version proxy: \{{ $labels.result }} for over 15 minutes (\{{ $value | humanize }} req/s)'
            consequence: Requests for an older decorator version get this version's HTML or a 5xx response, which can break styling for the caller.
            action: "Check the logs for 'Version proxy:' and the status of the nav-dekoratoren-<version> internal app (`kubectl get app -n personbruker | grep nav-dekoratoren-`)"
          labels:
            namespace: personbruker
            severity: warning
        # Calls from this app to nav-dekoratoren-api that fail: a 5xx answer, or no answer at all
        - alert: nav-dekoratoren calls to nav-dekoratoren-api failing
          expr: |
            100 * (
              (sum(rate(http_client_request_duration_seconds_count{namespace="personbruker", app="nav-dekoratoren", server_address="nav-dekoratoren-api.navno", http_response_status_code=~"5.."}[5m])) or vector(0))
              + (sum(rate(http_client_request_duration_seconds_count{namespace="personbruker", app="nav-dekoratoren", server_address="nav-dekoratoren-api.navno", http_response_status_code="", error_type!=""}[5m])) or vector(0))
            ) / sum(rate(http_client_request_duration_seconds_count{namespace="personbruker", app="nav-dekoratoren", server_address="nav-dekoratoren-api.navno"}[5m])) > 1
          for: 5m
          annotations:
            summary: '[nav-dekoratoren] \{{ $value | humanize }}% of calls to nav-dekoratoren-api fail'
            consequence: Calls that still fail after the retry show logged-in users as logged out, and hanging calls slow down /auth.
            action: "Check nav-dekoratoren-api: pods not completing requests (ktor_http_server_requests_active), its Wonderwall logs ('proxy error'), and the 'Auth api' / 'Auth error' lines in this app's logs."
          labels:
            namespace: personbruker
            severity: warning
