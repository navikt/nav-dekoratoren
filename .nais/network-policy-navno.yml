apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nav-dekoratoren-internal
  namespace: navno
  labels:
    team: navno
spec:
  podSelector:
    matchLabels:
      dekoratorenType: external
  policyTypes:
    - Egress
  egress:
    - to:
      - podSelector:
          matchLabels:
            dekoratorenType: internal
